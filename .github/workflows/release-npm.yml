name: Release npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.1). Must match package.json.'
        required: true

permissions:
  contents: read

jobs:
  ios-binary:
    name: Build iOS native binary
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require release tag for this selected commit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/release-tag.mjs require
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install binary build tools
        run: brew install xcodegen xcbeautify
      - name: Build device and simulator XCFramework
        run: bash scripts/build-rn-ios-xcframework.sh
      - uses: actions/upload-artifact@v7
        with:
          name: rn-ios-frameworks
          path: packages/hakka-react-native/ios/Frameworks/
          if-no-files-found: error

  release:
    name: Build, Test & Publish
    needs: ios-binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: rn-ios-frameworks
          path: packages/hakka-react-native/ios/Frameworks/
      - name: Verify iOS binary matches packaged sources
        run: node scripts/verify-rn-ios-xcframework.mjs

      - name: Verify all npm package versions match the input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Benchmark packages are private and keep their own version.
          for dir in packages/*/; do
            if [ "$(node -e "console.log(require('./$dir/package.json').private === true)")" = "true" ]; then continue; fi
            PKG_VERSION=$(node -e "console.log(require('./$dir/package.json').version)")
            if [ "$PKG_VERSION" != "$VERSION" ]; then
              echo "Version mismatch in $dir: $PKG_VERSION != $VERSION"
              echo "Run 'bun run version-packages' (changesets), commit, then re-run."
              exit 1
            fi
          done
      - name: Verify all JS package + native versions are in lockstep
        run: node scripts/version-audit.mjs

      - name: Require release tag for this selected commit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/release-tag.mjs require

      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - run: bun run pack:npm:dry-run
      - name: Verify Android Maven dependencies are published
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for artifact in \
            hakka-common \
            hakka-network \
            hakka-network-noop \
            hakka-performance \
            hakka-performance-noop \
            hakka-ui
          do
            url="https://repo1.maven.org/maven2/com/noodleapps/hakka/${artifact}/${VERSION}/${artifact}-${VERSION}.pom"
            if ! curl --fail --silent --head "$url" >/dev/null; then
              echo "Missing Maven Central artifact required by npm Android bridge: $url"
              echo "Publish Android artifacts before publishing hakka-react-native."
              exit 1
            fi
          done
      - name: Publish to npm (dependency order — core, then its dependents, then leaves)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          # Exact internal pins require this dependency order.
          for pkg in \
            hakka-core \
            hakka-bridge \
            hakka-browser \
            hakka-node \
            hakka-react-native \
            hakka-rozenite \
            hakka-cli
          do
            echo "::group::Publishing $pkg"
            view_error=$(mktemp)
            if published_version=$(npm view "${pkg}@${VERSION}" version --registry=https://registry.npmjs.org 2>"$view_error"); then
              if [ "$published_version" != "$VERSION" ]; then
                echo "Registry returned unexpected version for $pkg: $published_version"
                cat "$view_error"
                exit 1
              fi
              echo "$pkg@$VERSION is already published; skipping it."
            elif grep -q 'E404' "$view_error"; then
              (cd "packages/$pkg" && npm publish --access public --provenance)
            else
              echo "Could not determine whether $pkg@$VERSION is already published."
              cat "$view_error"
              exit 1
            fi
            rm -f "$view_error"
            echo "::endgroup::"
          done
