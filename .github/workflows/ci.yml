name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx oxlint .
      - run: bunx oxfmt --check .
      - run: node scripts/sync-rn-ios.mjs --check
      - run: node scripts/sync-design-tokens.mjs --check
      - run: node scripts/file-size-check.mjs

  ts-build-test:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Build first so workspace imports can resolve dist declarations.
      - run: bun run build
      - run: bun run typecheck
      - run: node scripts/spec-drift-check.mjs
      - run: node scripts/spec-api-check.mjs
      - run: node scripts/smoke-control-roundtrip.mjs
      - run: bun run test
      # Shared-runner timing is advisory; local benchmark budgets remain enforced.
      - name: Perf gates (advisory)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          bun run --cwd packages/hakka-core bench:check
          bun run --cwd packages/hakka-node bench:check
          bun run --cwd packages/hakka-bench bench:check
      - run: node scripts/web-size-gate.mjs

  web-e2e:
    name: Web E2E (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: extractions/setup-just@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium (+ OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Install Playwright OS deps only (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - name: just test-e2e
        run: just test-e2e

  android-sdk:
    name: Android SDK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # build includes unit tests and lint; the demo checks SDK consumer compilation.
      - run: ./gradlew :hakka-common:build :hakka-network:build :hakka-network-noop:build :hakka-performance:build :hakka-performance-noop:build :hakka-ui:build :example:assembleDebug
      - run: ../scripts/android-size-gate.sh

  desktop-app:
    name: Desktop App (macOS, apps/hakka)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/hakka
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: apps/hakka/.build
          key: spm-desktop-${{ runner.os }}-${{ hashFiles('apps/hakka/Package.swift', 'ios/Package.swift') }}
          restore-keys: spm-desktop-${{ runner.os }}-
      - run: swift build
      - run: swift test

  ios-sdk:
    name: iOS SDK
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ios/.build
          key: spm-${{ runner.os }}-${{ hashFiles('ios/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-
      - run: swift build
      # Blocking pause/resume tests must not compete for runner threads.
      - run: swift test --no-parallel
      # RN flattens the canonical SDK sources into a single module.
      - name: Typecheck RN iOS copy (flattened single module)
        run: |
          cd "$GITHUB_WORKSPACE"
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          find packages/hakka-react-native/ios/Core packages/hakka-react-native/ios/Performance -name '*.swift' -print0 \
            | xargs -0 xcrun swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios16.0-simulator

  # macOS SwiftPM builds omit UIKit; compile the iOS consumer separately.
  ios-demo-app:
    name: iOS Demo App (HakkaUI on simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: demoapp-${{ runner.os }}-${{ hashFiles('ios/Package.swift') }}
          restore-keys: demoapp-${{ runner.os }}-
      - name: Build HakkaDemoApp for iOS Simulator
        working-directory: ios/Example
        run: |
          xcodebuild -project HakkaDemoApp.xcodeproj -scheme HakkaDemoApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  rn-example-ios:
    name: RN Example (iOS pods + xcodebuild)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: examples/react-native-example/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('examples/react-native-example/ios/Podfile', 'examples/react-native-example/ios/Podfile.lock', 'examples/react-native-example/package.json', 'bun.lock') }}
      - name: Install ccache and identify the Xcode toolchain
        id: rn-ios-toolchain
        run: |
          command -v ccache >/dev/null || brew install ccache
          xcode_version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)
          echo "xcode-version=$xcode_version" >> "$GITHUB_OUTPUT"
      - name: Cache RN iOS compiler outputs
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ccache
          key: rn-ios-ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.rn-ios-toolchain.outputs.xcode-version }}-${{ hashFiles('examples/react-native-example/ios/Podfile', 'examples/react-native-example/ios/Podfile.lock', 'examples/react-native-example/package.json', 'bun.lock') }}
          restore-keys: rn-ios-ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.rn-ios-toolchain.outputs.xcode-version }}-
      - name: Cache precompiled Hakka native SDK
        id: rn-native-binary
        uses: actions/cache@v6
        with:
          path: packages/hakka-react-native/ios/Frameworks/
          key: hakka-ios-binary-${{ runner.os }}-${{ steps.rn-ios-toolchain.outputs.xcode-version }}-${{ hashFiles('packages/hakka-react-native/ios/Core/**/*.swift', 'packages/hakka-react-native/ios/Performance/**/*.swift', 'packages/hakka-react-native/ios/UI/**/*.swift', 'packages/hakka-react-native/package.json', 'scripts/build-rn-ios-xcframework.sh', 'scripts/rn-ios-xcframework-project.yml') }}
      - name: Build precompiled Hakka native SDK
        if: steps.rn-native-binary.outputs.cache-hit != 'true'
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v xcbeautify >/dev/null || brew install xcbeautify
          bash scripts/build-rn-ios-xcframework.sh
      - name: Verify precompiled Hakka native SDK
        run: node scripts/verify-rn-ios-xcframework.mjs
      - name: Pod install (native binary plus RN bridge codegen)
        working-directory: examples/react-native-example/ios
        run: pod install
      - name: Build example app for iOS Simulator
        working-directory: examples/react-native-example/ios
        env:
          SKIP_BUNDLING: '1'
        run: |
          ccache --zero-stats
          xcodebuild -workspace HakkaRNExample.xcworkspace -scheme HakkaRNExample \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
          ccache --show-stats

  rn-example-android:
    name: RN Example (Android gradle)
    needs: rn-android-build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both Android variants
        env:
          RESULT: ${{ needs.rn-android-build.result }}
        run: test "$RESULT" = success

  rn-android-build:
    name: RN Android (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        variant: [Debug, Release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Cache RN Android native build outputs
        uses: actions/cache@v6
        with:
          path: |
            examples/react-native-example/android/app/.cxx
            node_modules/.bun/**/node_modules/**/android/.cxx
          key: rn-android-cxx-${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('packages/hakka-react-native/android/**/*.gradle', 'packages/hakka-react-native/android/**/*.properties', 'packages/hakka-react-native/android/src/**', 'packages/hakka-react-native/src/**', 'examples/react-native-example/android/**/*.gradle', 'examples/react-native-example/android/**/*.properties', 'examples/react-native-example/android/app/src/**') }}
          restore-keys: rn-android-cxx-${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant }}-${{ hashFiles('bun.lock') }}-
      - name: Publish Android SDK to the local Maven repository
        working-directory: android
        run: ./gradlew :hakka-common:publishToMavenLocal :hakka-network:publishToMavenLocal :hakka-performance:publishToMavenLocal :hakka-ui:publishToMavenLocal
      - name: Build Rozenite workspace dependencies
        run: |
          bun run --cwd packages/hakka-core build
          bun run --cwd packages/hakka-browser build
          bun run --cwd packages/hakka-rozenite build
      # iOS development bundling complements Android's production release bundle.
      - name: Metro bundle (optional peers absent on purpose)
        if: matrix.variant == 'Debug'
        working-directory: examples/react-native-example
        run: bun run bundle
      - name: Prepare WebView demo asset
        if: matrix.variant == 'Release'
        run: node examples/react-native-example/scripts/ensure-webview-asset.js
      # Separate runners avoid Gradle output/cache contention between variants.
      - name: Assemble ${{ matrix.variant }} APK
        working-directory: examples/react-native-example/android
        env:
          VARIANT: ${{ matrix.variant }}
        run: ./gradlew ":app:assemble$VARIANT" -PhakkaMinifyRelease=true -PreactNativeArchitectures=arm64-v8a

  next-fullstack-example:
    name: Next.js Example (build + ci-gate test + Playwright E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The example consumes workspace dist output as file dependencies.
      - run: bun run --cwd packages/hakka-core build
      - run: bun run --cwd packages/hakka-bridge build
      - run: bun run --cwd packages/hakka-node build
      - run: bun run --cwd packages/hakka-browser build
      - name: Run the ci-gate example's test
        run: bun test examples/ci-gate/ciGate.test.ts
      # npm installs real file dependencies; Turbopack rejects Bun's symlink layout.
      - name: Install the example as a real consumer
        working-directory: examples/next-fullstack
        run: npm ci
      - name: Build it
        working-directory: examples/next-fullstack
        run: npm run build

      - name: Cache Playwright browsers
        id: next-playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-next-${{ runner.os }}-${{ hashFiles('examples/next-fullstack/package-lock.json') }}
      - name: Install Playwright Chromium (+ OS deps)
        if: steps.next-playwright-cache.outputs.cache-hit != 'true'
        working-directory: examples/next-fullstack
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps only (browser cached)
        if: steps.next-playwright-cache.outputs.cache-hit == 'true'
        working-directory: examples/next-fullstack
        run: npx playwright install-deps chromium
      - name: Run the example's E2E suite
        working-directory: examples/next-fullstack
        run: npm run test:e2e
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: next-fullstack-playwright-traces
          path: examples/next-fullstack/test-results/
          retention-days: 7
