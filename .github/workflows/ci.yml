name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx oxlint .
      - run: bunx oxfmt --check .
      - run: node scripts/sync-rn-ios.mjs --check
      - run: node scripts/sync-design-tokens.mjs --check
      - run: node scripts/file-size-check.mjs

  ts-build-test:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Build BEFORE typecheck: workspace packages resolve each other's types
      # through their dist declarations, which don't exist on a fresh runner.
      - run: bun run build
      - run: bun run typecheck
      # Cheap correctness gates, run right after build: spec-drift-check reads
      # only markdown (docs/spec cards vs SPEC.md §5); smoke-control-roundtrip
      # imports packages/{bridge,cli,core}/src directly under bun (it
      # re-execs itself under bun when invoked via `node`), so neither needs
      # `bun run build`'s dist output — placed after it only per convention.
      - run: node scripts/spec-drift-check.mjs
      # spec-drift-check compares markdown to markdown, so it cannot catch a
      # card documenting an API the code doesn't have. This reads the import
      # blocks and checks each symbol against the package's real exports —
      # it found two cards pointing at the wrong entry point.
      - run: node scripts/spec-api-check.mjs
      - run: node scripts/smoke-control-roundtrip.mjs
      - run: bun run test
      # Perf gates run ADVISORY here, never blocking. Their budgets are
      # sub-microsecond in places (RingBuffer.add at 700ns) and calibrated on a
      # quiet dev machine; a shared 2-core runner cannot resolve that, so a red
      # build would mean "the runner was busy", not "the code got slower". The
      # numbers are still printed, so a genuine 2-3x regression is visible in
      # the log — and the budgets stay enforced where they are measurable, via
      # `just bench` locally. Same policy as the Android, iOS, and web perf
      # suites, which are opt-in for the identical reason.
      - name: Perf gates (advisory — see comment)
        continue-on-error: true
        run: |
          bun run --cwd packages/hakka-core bench:check
          bun run --cwd packages/hakka-node bench:check
          bun run --cwd packages/hakka-bench bench:check
      # Bundle-size gate: fails if a hakka-browser bundle exceeds its gzip budget.
      - run: node scripts/web-size-gate.mjs

  node-compatibility:
    name: Node Compatibility (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24.x']
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-node-${{ matrix.node }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-node-${{ matrix.node }}-
      - run: bun install --frozen-lockfile
      - run: |
          bun run --cwd packages/hakka-core build
          bun run --cwd packages/hakka-bridge build
          bun run --cwd packages/hakka-node build
          bun run --cwd packages/hakka-cli build
      - run: node scripts/smoke-node-compat.mjs

  web-e2e:
    name: Web E2E (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: extractions/setup-just@v4
        with:
          # Unauthenticated release lookups rate-limit on shared runners
          # ("no release for just matching version specifier").
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Playwright's documented CI caching convention (playwright.dev/docs/ci#caching-browsers):
      # cache ~/.cache/ms-playwright keyed on the lockfile, skip the browser
      # download on a hit, but still run install-deps (fast, no download) so
      # OS-level dependencies stay present on a fresh runner image.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium (+ OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Install Playwright OS deps only (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - name: just test-e2e
        run: just test-e2e

  android-sdk:
    name: Android SDK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/**/*.properties', 'packages/hakka-react-native/android/build.gradle', 'packages/hakka-react-native/android/gradle.properties', 'packages/hakka-react-native/examples/react-native-example/android/build.gradle', 'packages/hakka-react-native/examples/react-native-example/android/gradle.properties', 'scripts/android-size-gate.sh') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: ./gradlew :hakka-common:build :hakka-network:build :hakka-network-noop:build :hakka-performance:build :hakka-performance-noop:build :hakka-ui:build
      - run: ./gradlew :hakka-common:test :hakka-network:test :hakka-network-noop:test :hakka-performance:test :hakka-performance-noop:test :hakka-ui:test
      # Drift catcher, the Android mirror of the ios-demo-app job below. The demo
      # consumes the modules as a real app target, so it catches what :hakka-ui:build
      # cannot: a public API that compiles inside the module but is unreachable from
      # a consumer. Without this, android/example was built by nothing at all.
      - run: ./gradlew :example:assembleDebug
      - run: ../scripts/android-size-gate.sh

  desktop-app:
    name: Desktop App (macOS, apps/hakka)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/hakka
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          # Keyed on both manifests: apps/hakka consumes ios/ by path, so an
          # ios/Package.swift change invalidates this build too.
          path: apps/hakka/.build
          key: spm-desktop-${{ runner.os }}-${{ hashFiles('apps/hakka/Package.swift', 'ios/Package.swift') }}
          restore-keys: spm-desktop-${{ runner.os }}-
      - run: swift build
      - run: swift test

  ios-sdk:
    name: iOS SDK
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ios/.build
          key: spm-${{ runner.os }}-${{ hashFiles('ios/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-
      - run: swift build
      # --no-parallel: the BreakpointEngine tests exercise a blocking
      # pause/resume API and park real threads by design. Run alongside the
      # other 70 suites on a 3-core runner, those parked threads starve
      # libdispatch and unrelated concurrency tests see none of their dispatched
      # work run at all. Serialized, the suite is ~1s. See ios/Tests/HakkaTests/
      # BlockingTestSupport.swift for the full story.
      - run: swift test --no-parallel
      # The RN package ships its own copy of these sources (synced from ios/Sources)
      # and compiles them as one flattened module. Typecheck that here — nothing else
      # in CI compiles the RN Swift, so drift used to ship silently to users.
      - name: Typecheck RN iOS copy (flattened single module)
        run: |
          cd "$GITHUB_WORKSPACE"
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          find packages/hakka-react-native/ios/Core packages/hakka-react-native/ios/Performance -name '*.swift' -print0 \
            | xargs -0 xcrun swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios16.0-simulator

  # ── Example-app builds: the drift catchers. ─────────────────────────────────
  # `swift build` targets macOS and skips every canImport(UIKit) file, so HakkaUI
  # bugs ship invisibly without these. One session's worth of evidence: a missing
  # HakkaCommon import, iOS-17-only APIs on an iOS-16 target, sync-manifest gaps,
  # and an RN Android wrapper that never compiled — all caught only by example builds.

  ios-demo-app:
    name: iOS Demo App (HakkaUI on simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: demoapp-${{ runner.os }}-${{ hashFiles('ios/Package.swift') }}
          restore-keys: demoapp-${{ runner.os }}-
      - name: Build HakkaDemoApp for iOS Simulator
        working-directory: ios/Example
        run: |
          xcodebuild -project HakkaDemoApp.xcodeproj -scheme HakkaDemoApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  rn-example-ios:
    name: RN Example (iOS pods + xcodebuild)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: packages/hakka-react-native/examples/react-native-example/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('packages/hakka-react-native/examples/react-native-example/ios/Podfile') }}
          restore-keys: pods-${{ runner.os }}-
      - name: Pod install (runs RN codegen against the vendored sources)
        working-directory: packages/hakka-react-native/examples/react-native-example/ios
        run: pod install
      - name: Build example app for iOS Simulator
        working-directory: packages/hakka-react-native/examples/react-native-example/ios
        env:
          SKIP_BUNDLING: '1'
        run: |
          xcodebuild -workspace HakkaRNExample.xcworkspace -scheme HakkaRNExample \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  rn-example-android:
    name: RN Example (Android gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-rnexample-${{ runner.os }}-${{ hashFiles('packages/hakka-react-native/examples/react-native-example/android/**/*.gradle', 'packages/hakka-react-native/android/build.gradle') }}
          restore-keys: gradle-rnexample-${{ runner.os }}-
      - name: Publish Android SDK to the local Maven repository
        run: cd android && ./gradlew publishToMavenLocal
      - name: Assemble debug APK (compiles the RN bridge Kotlin)
        working-directory: packages/hakka-react-native/examples/react-native-example/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a
      # Drift catcher. assembleDebug and the iOS job both skip JS bundling, so
      # neither can see a Metro resolution failure. Hakka's optional peer deps
      # are require()d behind try/catch, which guards runtime but NOT Metro's
      # static bundle-time resolution: with none of them installed (as here),
      # the bundle failed on `react-native-mmkv` and no CI job noticed.
      # hakka-react-native/metro's withHakka() is what makes it pass.
      - name: Metro bundle (optional peers absent on purpose)
        working-directory: packages/hakka-react-native/examples/react-native-example
        run: bun run bundle

  next-fullstack-example:
    name: Next.js Example (build + ci-gate test + Playwright E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # examples/next-fullstack consumes hakka-node and hakka-browser through
      # `file:` deps that point at their dist/ output, so those must exist first.
      - run: bun run --cwd packages/hakka-core build
      - run: bun run --cwd packages/hakka-bridge build
      - run: bun run --cwd packages/hakka-node build
      - run: bun run --cwd packages/hakka-browser build
      # The ci-gate example is not picked up by `bun test` in packages/hakka-node
      # (it lives under examples/), so nothing ran it before this step.
      - name: Run the ci-gate example's test
        run: bun test packages/hakka-node/examples/ci-gate/ciGate.test.ts
      # npm, not bun: bun lays `file:` deps out as per-file symlinks and Turbopack
      # rejects a symlinked package.json. See the example's own README.
      - name: Install the example as a real consumer
        working-directory: examples/next-fullstack
        run: npm install
      - name: Build it
        working-directory: examples/next-fullstack
        run: npm run build

      # AFTER the npm install above, deliberately: `webServer` starts a real `next dev`,
      # and Turbopack rejects the symlinked package.json that bun's `file:` dep layout
      # produces, so running this against the bun install would fail on the install
      # shape rather than on anything the tests assert.
      #
      # This is the only coverage anywhere in this repo that a real click produces the
      # client + server rows the README claims, in a real browser. Unit tests cannot see
      # it: three bugs shipped past a green suite this cycle because they asserted on an
      # intermediate artifact instead of observable behaviour.
      - name: Install Playwright Chromium
        working-directory: examples/next-fullstack
        run: npx playwright install --with-deps chromium
      - name: Run the example's E2E suite
        working-directory: examples/next-fullstack
        run: npm run test:e2e
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: next-fullstack-playwright-traces
          path: examples/next-fullstack/test-results/
          retention-days: 7
