name: Release Desktop (macOS)

# Builds, packages, and (when secrets are configured) signs and notarizes
# Hakka for macOS, then attaches the result to a GitHub Release.
#
# Required secrets for the signing/notarization/release steps — set under
# Settings > Secrets and variables > Actions. Without them, this workflow
# still builds, tests, and packages a real .app (adhoc-signed, uploaded as a
# build artifact); it just skips codesign/notarytool/gh release. Full detail
# on obtaining each of these: docs/src/content/docs/desktop/distribution.md.
#
#   MACOS_CERTIFICATE_P12_BASE64    Developer ID Application cert + private
#                                    key, exported from Keychain Access as a
#                                    .p12 and base64-encoded (`base64 -i cert.p12`).
#   MACOS_CERTIFICATE_PASSWORD      Password the .p12 was exported with.
#   MACOS_KEYCHAIN_PASSWORD         Any password for the throwaway CI keychain
#                                    this workflow creates — not an Apple
#                                    credential, just needs to exist.
#   APPLE_ID                        Apple ID email used for notarization.
#   APPLE_TEAM_ID                   Developer Team ID (e.g. BR3WT6376A).
#   APPLE_APP_SPECIFIC_PASSWORD     App-specific password for that Apple ID
#                                    from appleid.apple.com, scoped to
#                                    notarization use.
#
# This workflow does not touch the Homebrew tap — that step lives only in the
# local `Scripts/make_release.sh` flow, which depends on a tap checkout on
# the releaser's machine and is intentionally not reproduced in CI.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0). Must match apps/hakka/version.env MARKETING_VERSION.'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build, Package, Sign & Notarize
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/hakka
    steps:
      - uses: actions/checkout@v4

      - name: Verify version matches version.env
        env:
          VERSION: ${{ inputs.version }}
        run: |
          source version.env
          if [[ "$MARKETING_VERSION" != "$VERSION" ]]; then
            echo "Version mismatch: apps/hakka/version.env has MARKETING_VERSION=$MARKETING_VERSION but the workflow input is $VERSION"
            echo "Bump version.env (MARKETING_VERSION and BUILD_NUMBER), commit, then re-run."
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          # Keyed on both manifests: apps/hakka consumes ios/ by path, so an
          # ios/Package.swift change invalidates this build too (mirrors
          # ci.yml's desktop-app job).
          path: apps/hakka/.build
          key: spm-desktop-release-${{ runner.os }}-${{ hashFiles('apps/hakka/Package.swift', 'ios/Package.swift') }}
          restore-keys: spm-desktop-release-${{ runner.os }}-

      - name: swift build (debug, fast correctness gate before the release build)
        run: swift build
      - run: swift test

      - name: Package .app (adhoc-signed; real signing is the conditional step below)
        run: SIGNING_MODE=adhoc ./Scripts/package_app.sh release

      - name: Confirm the bundle is a real, launchable Mach-O app
        run: |
          test -x Hakka.app/Contents/MacOS/Hakka
          file Hakka.app/Contents/MacOS/Hakka
          /usr/bin/plutil -lint Hakka.app/Contents/Info.plist
          codesign -dv Hakka.app

      - name: Check release-signing secrets are configured
        id: secrets-check
        run: |
          if [[ -n "${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}" && -n "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" \
             && -n "${{ secrets.MACOS_KEYCHAIN_PASSWORD }}" && -n "${{ secrets.APPLE_ID }}" \
             && -n "${{ secrets.APPLE_TEAM_ID }}" && -n "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" ]]; then
            echo "have-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "have-secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing/notarization secrets are not fully configured. Skipping codesign, notarization, and the GitHub release. The adhoc-signed .app is still uploaded as a build artifact. See docs/src/content/docs/desktop/distribution.md for the six required secrets."
          fi

      - name: Import Developer ID certificate into a throwaway keychain
        if: steps.secrets-check.outputs.have-secrets == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release-desktop.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Required since macOS Sierra: without it, codesign hits a keychain
          # ACL prompt that has no one to answer it on a headless runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Prepend (not replace) the runner's existing search list so
          # `security find-identity`, codesign, and notarytool all see the
          # imported identity and the stored notary credentials below.
          EXISTING_KEYCHAINS=()
          while IFS= read -r keychain; do
            [[ -n "$keychain" ]] && EXISTING_KEYCHAINS+=("$keychain")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*"//; s/"$//')
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING_KEYCHAINS[@]}"
          security default-keychain -s "$KEYCHAIN"

          rm -f "$CERT_PATH"

      - name: Store notarytool credentials
        if: steps.secrets-check.outputs.have-secrets == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials hakka-ci \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"

      # Universal build: sign-and-notarize.sh defaults ARCHES to arm64 + x86_64
      # so a downloaded release launches on Intel Macs too.
      - name: Sign (hardened runtime), notarize, staple, zip
        if: steps.secrets-check.outputs.have-secrets == 'true'
        env:
          NOTARY_PROFILE: hakka-ci
        run: ./Scripts/sign-and-notarize.sh

      - name: Upload adhoc-signed .app (secrets not configured, build artifact only, not for distribution)
        if: steps.secrets-check.outputs.have-secrets != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Hakka-unsigned-${{ inputs.version }}
          path: apps/hakka/Hakka.app
          if-no-files-found: error

      - name: Upload notarized release zip
        if: steps.secrets-check.outputs.have-secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Hakka-${{ inputs.version }}
          path: apps/hakka/Hakka-*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.secrets-check.outputs.have-secrets == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" Hakka-*.zip \
            --title "Hakka for macOS ${VERSION}" \
            --generate-notes

      - name: Clean up the throwaway keychain
        if: always() && steps.secrets-check.outputs.have-secrets == 'true'
        run: security delete-keychain "$RUNNER_TEMP/release-desktop.keychain-db" || true
