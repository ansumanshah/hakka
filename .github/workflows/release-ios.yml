name: Release iOS SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 0.1.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build, Test & Release
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify version matches
        env:
          VERSION: ${{ inputs.version }}
        run: |
          PODSPEC_VERSION=$(ruby -e 'text = File.read("Hakka.podspec"); puts text[/s\.version\s*=\s*"([^"]+)"/, 1]')
          if [ "$PODSPEC_VERSION" != "$VERSION" ]; then
            echo "Version mismatch: ios/Hakka.podspec has $PODSPEC_VERSION but workflow input is $VERSION"
            exit 1
          fi
      - run: swift build
      # --no-parallel for the same reason as ci.yml's ios-sdk job: the
      # BreakpointEngine tests park real threads and starve libdispatch when
      # they run alongside the other suites on a shared runner.
      - run: swift test --no-parallel
      - name: Validate podspec
        run: pod ipc spec Hakka.podspec >/dev/null
      - name: Create release tag at the selected commit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          node ../scripts/release-tag.mjs create
          git push origin "refs/tags/v${RELEASE_VERSION}"
      - name: Create the shared GitHub Release when needed
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          view_error=$(mktemp)
          if gh release view "v${VERSION}" --json tagName >/dev/null 2>"$view_error"; then
            echo "GitHub Release v${VERSION} already exists for the checked tag."
          elif grep -qi 'not found' "$view_error"; then
            gh release create "v${VERSION}" --verify-tag --title "Hakka ${VERSION}" --generate-notes
          else
            echo "Could not determine whether GitHub Release v${VERSION} already exists."
            cat "$view_error"
            exit 1
          fi
          rm -f "$view_error"
