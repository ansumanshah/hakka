<template id="actions-template">
  <section id="root" class="scene actions" data-composition-id="actions" data-width="1280" data-height="720">
    <div class="scene-content actions-content">
      <p class="eyebrow actions-kicker">Move from evidence to action</p>
      <div class="actions-grid">
        <div>
          <h2 class="actions-title">Inspect.<br /><span class="jade">Mock.</span><br />Export.</h2>
        </div>
        <div class="code-card">
          <span class="label">CLI / MCP examples</span>
          <pre><code>npx hakka-cli init

npx hakka-cli mcp</code></pre>
        </div>
      </div>
      <p class="copy actions-copy">Use the record where your investigation continues.</p>
    </div>
    <p class="corner">04 / 05</p>
  </section>
  <style>
    @font-face {
      font-family: 'Hakka System';
      src: local('Arial');
    }
    @font-face {
      font-family: 'Menlo';
      src: local('Menlo');
    }
    #root {
      font-family: 'Hakka System', sans-serif;
    }
    .actions-content {
      justify-content: center;
    }
    .actions-grid {
      align-items: end;
      display: grid;
      gap: 90px;
      grid-template-columns: 1fr 390px;
      margin-top: 22px;
    }
    .actions-title {
      font-size: 76px;
      letter-spacing: -0.03em;
      line-height: 0.88;
      margin: 0;
    }
    .code-card {
      background: var(--paper);
      color: var(--graphite);
      padding: 26px;
    }
    .code-card .label {
      background: var(--graphite);
      border-color: var(--graphite);
      color: var(--paper);
      font-size: 14px;
      padding: 7px 10px;
    }
    .code-card pre {
      font-family: 'Menlo', monospace;
      font-size: 20px;
      line-height: 1.55;
      margin: 28px 0 0;
      white-space: pre-wrap;
    }
    .actions-copy {
      margin-top: 35px;
    }
  </style>
  <script>
    const actionsRoot = document.querySelector('[data-composition-id="actions"]')
    const actionsTimeline = gsap.timeline({ paused: true })
    actionsTimeline
      .from(actionsRoot.querySelector('.actions-kicker'), {
        duration: 0.35,
        opacity: 0,
        y: 16,
      })
      .from(actionsRoot.querySelector('.actions-title'), { duration: 0.6, opacity: 0, y: 32 }, '-=0.1')
      .from(actionsRoot.querySelector('.code-card'), { duration: 0.55, opacity: 0, rotate: 2, y: 28 }, '-=0.35')
      .from(actionsRoot.querySelector('.actions-copy'), { duration: 0.35, opacity: 0, y: 16 }, '-=0.15')
    window.__timelines.actions = actionsTimeline
  </script>
</template>
