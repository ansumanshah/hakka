buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['Hakka_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:9.1.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["Hakka_" + name]).toInteger()
}

android {
  namespace "com.noodleapps.hakka"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable += "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  
  // Match React Native's OkHttp line so consistent resolution stays compatible
  // with consuming React Native apps.
  compileOnly "com.squareup.okhttp3:okhttp:4.9.2"

  // hakka-network — compileOnly; the consuming app adds hakka-network directly.
  // Until published to Maven Central, apps include hakka-network as a local module.
  // After publishing: implementation("com.noodleapps.hakka:hakka-network:0.0.1")
  compileOnly "com.noodleapps.hakka:hakka-network:0.0.1"
  compileOnly "com.noodleapps.hakka:hakka-performance:0.0.1"

  testImplementation "junit:junit:4.13.2"
  // `compileOnly` (above) doesn't propagate to the test compile classpath, but
  // NativeConsoleStorageRelayTest needs hakka-common's LogEntry/StorageSnapshot/LogLevel
  // (reached transitively via hakka-network's `api project(":hakka-common")`) to assert
  // the exact wire shape the relay mirrors.
  testImplementation "com.noodleapps.hakka:hakka-network:0.0.1"
  // `LogEntry.toJson()`/`StorageSnapshot.toJson()` use org.json — compileOnly has no real
  // implementation off-device; JVM unit tests need the real jar, same as hakka-common's
  // own test config.
  testImplementation "org.json:json:20231013"
}
