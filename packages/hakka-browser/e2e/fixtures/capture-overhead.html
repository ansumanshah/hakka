<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hakka perf fixture — capture overhead</title>
  </head>
  <body>
    <!--
      Fixture for e2e/capture-overhead.spec.ts. `fetch` is replaced with an instantly
      resolving stub BEFORE Hakka starts, so the interceptor wraps the stub and the spec
      measures interception cost in a real browser (Response.clone / stream work included),
      not network time. `?capture=0` leaves Hakka off for the baseline.
    -->
    <script>
      const body = JSON.stringify({ id: 42, name: 'Ada', roles: ['a', 'b'], nested: { a: 1, b: [1, 2, 3] } })
      const headers = { 'content-type': 'application/json', 'content-length': String(body.length) }
      window.fetch = () => Promise.resolve(new Response(body, { status: 200, headers }))
    </script>
    <script src="../../dist/hakka-browser.global.js"></script>
    <script>
      if (new URLSearchParams(location.search).get('capture') !== '0') {
        Hakka.start({ overlay: false, resourceTiming: false, captureBeacons: false, console: false })
      }
    </script>
  </body>
</html>
