<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hakka perf fixture — render bench</title>
  </head>
  <body>
    <!--
      Fixture for e2e/render-bench.spec.ts.

      `Hakka.start()` is called with NO `overlay` option, so it defaults to
      `'launcher'` (see src/index.ts HakkaWebOptions): a tiny vanilla button
      mounts eagerly and the panel stays closed/unmounted until it's clicked
      or `show()` is called — the real cold-open path every user hits.

      Unlike fixtures/perf-scale.html and fixtures/perf-open.html, this
      fixture seeds NOTHING itself — every scenario in render-bench.spec.ts
      needs a different record count and open/closed starting state, so the
      spec drives all seeding via `Hakka.ingest()`/`Hakka.getLogs()` from
      page.evaluate, same public API scale-10k.spec.ts uses.

      `maxRequests` is raised well above 10,000 so the store's ring buffer
      (default cap 500, see hakka-core DEFAULT_CONFIG.maxRequests) never
      evicts a seeded record.
    -->
    <script src="../../dist/hakka-browser.global.js"></script>
    <script>
      Hakka.start({
        maxRequests: 20000,
        resourceTiming: false,
        captureBeacons: false,
        console: false,
      })
    </script>
  </body>
</html>
